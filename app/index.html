<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920">
<title>Launcher</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { width:1920px; height:1080px; overflow:hidden; background:#08080c; color:#fff;
    font-family:"SamsungOne","Segoe UI",-apple-system,Helvetica,Arial,sans-serif; -webkit-font-smoothing:antialiased; }
  .hide { display:none !important; }
  .sec { color:rgba(255,255,255,.62); }

  /* háttér: kép + olvashatósági árnyék + app-színű fény (csak opacity animál) */
  #amb { position:absolute; left:0; top:0; width:1920px; height:1080px; background:#08080c; }
  #bg { position:absolute; left:0; top:0; width:1920px; height:1080px; background:#08080c center/cover no-repeat; }
  #scrim { position:absolute; left:0; top:0; width:1920px; height:1080px;
    background:linear-gradient(90deg,rgba(0,0,0,.5),rgba(0,0,0,0) 55%), linear-gradient(0deg,rgba(0,0,0,.55),rgba(0,0,0,0) 45%); }
  #glows .g { position:absolute; left:0; top:0; width:1920px; height:1080px; opacity:0; transition:opacity 600ms ease; }
  #glows .g.on { opacity:.75; }

  /* HOME */
  #clock { position:absolute; left:120px; top:150px; font-size:210px; line-height:210px; font-weight:200; letter-spacing:-6px; }
  #date { position:absolute; left:128px; top:120px; font-size:34px; font-weight:500; text-transform:capitalize; }
  #wx { position:absolute; left:128px; top:380px; font-size:34px; font-weight:400; }

  #dock { position:absolute; left:0; width:1920px; bottom:170px; text-align:center; font-size:0; }
  .tile { position:relative; display:inline-flex; align-items:center; justify-content:center; vertical-align:top; width:200px; height:200px; margin:0 18px; border-radius:46px;
    transform:translateZ(0) scale(1); transition:transform 180ms cubic-bezier(.23,1,.32,1); }
  .tile::before, .card::before { content:""; position:absolute; left:0; top:0; right:0; bottom:0; border-radius:46px; z-index:-1;
    box-shadow:0 34px 60px rgba(0,0,0,.65); opacity:0; transition:opacity 180ms cubic-bezier(.23,1,.32,1); }
  .tile::after, .card::after { content:""; position:absolute; left:0; top:0; right:0; bottom:0; border-radius:46px; opacity:.5; pointer-events:none;
    background:linear-gradient(160deg, rgba(255,255,255,.32), rgba(255,255,255,0) 48%); transition:opacity 180ms cubic-bezier(.23,1,.32,1); }
  .tile img { max-width:110px; max-height:100px; }
  .tile svg { width:96px; height:96px; fill:#fff; }
  .tile.focus { transform:translateZ(0) scale(1.14); }
  .tile.focus::before, .card.focus::before, .tile.focus::after, .card.focus::after { opacity:1; }
  .tile.press { transform:translateZ(0) scale(1.07); transition-duration:90ms; }
  #label { position:absolute; left:0; width:1920px; bottom:92px; text-align:center; font-size:34px; font-weight:500; }

  /* SHELF */
  #hero { position:absolute; left:128px; top:210px; }
  #hero h1 { font-size:128px; line-height:128px; font-weight:700; letter-spacing:-4px; }
  #hero p { font-size:40px; margin-top:20px; font-weight:400; }
  #view { position:absolute; left:0; top:600px; width:1920px; height:330px; overflow:hidden; }
  #row { position:absolute; left:128px; top:50px; white-space:nowrap; font-size:0; transition:transform 300ms cubic-bezier(.23,1,.32,1); }
  .card { position:relative; display:inline-flex; align-items:center; justify-content:center; vertical-align:top; width:380px; height:214px; margin-right:44px; border-radius:30px;
    transform:translateZ(0) scale(1); transition:transform 180ms cubic-bezier(.23,1,.32,1); }
  .card::before, .card::after { border-radius:30px; }
  .card img { max-width:190px; max-height:90px; }
  .card svg { width:84px; height:84px; fill:#fff; }
  .card.focus { transform:translateZ(0) scale(1.1); }
  .card.press { transform:translateZ(0) scale(1.05); transition-duration:90ms; }
  #mini { position:absolute; right:120px; top:104px; text-align:right; font-size:40px; font-weight:500; }

  /* BEÁLLÍTÁSOK */
  #panel { position:absolute; left:0; top:0; width:1920px; height:1080px; background:rgba(0,0,0,.4); }
  #box { position:absolute; left:50%; top:50%; width:1040px; margin-left:-520px; margin-top:-360px; padding:44px 48px; border-radius:44px;
    background:rgba(34,34,42,.96); box-shadow:0 40px 90px rgba(0,0,0,.7); }
  #box h2 { font-size:44px; font-weight:600; margin-bottom:28px; }
  .row { display:flex; align-items:center; justify-content:space-between; height:88px; padding:0 32px; margin-bottom:8px; border-radius:22px; font-size:34px; }
  .row.sm { height:60px; font-size:28px; margin-bottom:4px; }
  .row.sm span:first-child { overflow:hidden; white-space:nowrap; text-overflow:ellipsis; max-width:620px; }
  .row.focus { background:rgba(255,255,255,.16); }
  .row .val { color:rgba(255,255,255,.7); }
  .row.focus .val { color:#fff; }
  #phint { margin-top:20px; font-size:24px; }

  #toast { position:absolute; left:0; width:1920px; bottom:30px; text-align:center; font-size:26px; opacity:0; transition:opacity 200ms ease; text-shadow:0 2px 10px #000; }
  #toast.show { opacity:1; }
  #hint { position:absolute; right:120px; bottom:40px; font-size:22px; opacity:.55; transition:opacity 600ms ease; }
  #hint.off { opacity:0; }
  /* Lightweight seasonal ambient layer; animation is compositor-friendly. */
  #xmas { position:absolute; inset:0; pointer-events:none; overflow:hidden; }
  #xmasGlow { position:absolute; inset:0;
    background:radial-gradient(900px 240px at 60% 82%,rgba(255,210,140,.26),transparent 70%);
    animation:xmasPulse 12s ease-in-out infinite; }
  #snow, #sparkles { position:absolute; inset:0; }
  .flake { position:absolute; top:-14px; border-radius:50%; background:rgba(255,255,255,.85);
    animation-name:xmasSnow; animation-timing-function:linear; animation-iteration-count:infinite; }
  .flake.drift-left { animation-name:xmasSnowLeft; }
  .spark { position:absolute; width:4px; height:4px; border-radius:50%;
    background:rgba(255,244,218,.9); animation:xmasSpark 8s ease-in-out infinite; }
  @keyframes xmasSnow { 0% { transform:translate3d(0,0,0);opacity:0; }
    8% {opacity:.55;} 90% {opacity:.55;} 100% {transform:translate3d(55px,1130px,0);opacity:0;} }
  @keyframes xmasSnowLeft { 0% {transform:translate3d(0,0,0);opacity:0;}
    8% {opacity:.55;} 90% {opacity:.55;} 100% {transform:translate3d(-55px,1130px,0);opacity:0;} }
  @keyframes xmasSpark { 0%,38%,62%,100% {opacity:0;transform:scale(.8);}
    50% {opacity:.7;transform:scale(1.3);} }
  @keyframes xmasPulse { 0%,100% {opacity:.14;} 50% {opacity:.27;} }
  @media (prefers-reduced-motion:reduce) {
    .flake,.spark,#xmasGlow { animation:none !important; }
    .flake,.spark { display:none; }
    #xmasGlow {opacity:.18;}
  }
</style>
</head>
<body>

<div id="amb"><div id="bg"></div><div id="glows"></div><div id="xmas" class="hide"><div id="xmasGlow"></div><div id="snow"></div><div id="sparkles"></div></div><div id="scrim"></div></div>

<div id="home">
  <div id="date" class="sec"></div>
  <div id="clock"></div>
  <div id="wx" class="sec"></div>
  <div id="dock"></div>
  <div id="label"></div>
</div>

<div id="shelf" class="hide">
  <div id="mini"><span id="mclock"></span><div id="mwx" class="sec" style="font-size:28px;font-weight:400;margin-top:6px"></div></div>
  <div id="hero"><h1 id="ctitle"></h1><p id="csub" class="sec"></p></div>
  <div id="view"><div id="row"></div></div>
</div>

<div id="panel" class="hide"><div id="box"><h2 id="ptitle">Beállítások</h2><div id="rows"></div><div id="phint" class="sec">Fel/le: kijelölés · Balra/jobbra: érték · OK: választás · Vissza: bezár</div></div></div>

<div id="toast"></div>
<div id="hint">1 Home · 2 Polc</div>

<script>
// ponytail: appId-k Samsung alapértelmezések, modellenként eltérhetnek; a TV-n ellenőrizd.
var GEAR = "M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z";
var ITEMS = [
  { name:"Netflix", id:"3201907018807", color:"#e50914", logo:"logos/netflix.svg",    sub:"Sorozatok és filmek" },
  { name:"YouTube", id:"111299001912",  color:"#ff0000", logo:"logos/youtube.svg",    sub:"Videók" },
  { name:"Prime",   id:"3201910019365", color:"#00a8e1", logo:"logos/primevideo.svg", sub:"Prime Video" },
  { name:"Disney+", id:"3201901017640", color:"#113ccf", logo:"logos/disneyplus.svg", sub:"Disney+" },
  { name:"Plex",    id:"3201512006963", color:"#e5a00d", logo:"logos/plex.svg",       sub:"Saját médiatár" },
  { name:"Spotify", id:"3201606009684", color:"#1ed760", logo:"logos/spotify.svg",    sub:"Zene" },
  { name:"Beállítások", settings:true,  color:"#6b6b78", sub:"Nézet, város, háttér" }
];
var CITIES = [
  { name:"Kaposfő",  lat:46.36,  lon:17.66 },
  { name:"Kaposvár", lat:46.3594, lon:17.7968 },
  { name:"Siófok",   lat:46.9041, lon:18.0579 },
  { name:"Pécs",     lat:46.0727, lon:18.2323 },
  { name:"Budapest", lat:47.4979, lon:19.0402 }
];
// ponytail: a Samsung beállítások app azonosítója nem ellenőrzött; 2017-es modelleken lehet, hogy nem indítható.
var TV_SETTINGS_ID = "org.tizen.menu-setting";

var S = { mode:"home", city:0, bg:"1", glow:"on", xmas:"auto" };
var idx = 0, panel = false, prow = 0, pview = "main", aoff = 0, arow = 0;
var INSTALLED = [], TV_ID = TV_SETTINGS_ID;

function $(id) { return document.getElementById(id); }
function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) {} }
function load() { try { var j = JSON.parse(store("s") || "{}"); for (var k in j) if (k in S) S[k] = j[k]; } catch (e) {} if (!CITIES[S.city]) S.city = 0; if (S.bg === "on") S.bg = "1"; }
function save() { store("s", JSON.stringify(S)); }
function paint(el, c) { el.style.background = "linear-gradient(180deg," + c + ",rgba(0,0,0,.5)), " + c; }
function content(el, a) {
  if (a.settings) el.innerHTML = '<svg viewBox="0 0 24 24"><path d="' + GEAR + '"/></svg>';
  else el.innerHTML = '<img src="' + a.logo + '" alt="' + a.name + '">';
}

var glows = [], tiles = [], cards = [];
ITEMS.forEach(function (a) {
  var g = document.createElement("div");
  g.className = "g";
  g.style.background = "radial-gradient(1000px 640px at 78% 8%," + a.color + "88,rgba(0,0,0,0) 70%)";
  $("glows").appendChild(g); glows.push(g);

  var t = document.createElement("div"); t.className = "tile"; paint(t, a.color); content(t, a);
  $("dock").appendChild(t); tiles.push(t);

  var c = document.createElement("div"); c.className = "card"; paint(c, a.color); content(c, a);
  $("row").appendChild(c); cards.push(c);
});

function render() {
  for (var k = 0; k < ITEMS.length; k++) {
    var on = k === idx;
    tiles[k].classList.toggle("focus", on && S.mode === "home");
    cards[k].classList.toggle("focus", on && S.mode === "shelf");
    glows[k].classList.toggle("on", on);
  }
  $("label").textContent = ITEMS[idx].name;
  $("ctitle").textContent = ITEMS[idx].name;
  $("csub").textContent = ITEMS[idx].sub;
  $("row").style.webkitTransform = $("row").style.transform = "translateX(" + (-Math.max(0, idx - 2) * 424) + "px)";
}
function isChristmasSeason(d) {
  var month = d.getMonth(), day = d.getDate();
  return (month === 10 && day >= 15) || month === 11 || (month === 0 && day <= 6);
}
function christmasEnabled() {
  return S.xmas === "on" || (S.xmas === "auto" && isChristmasSeason(new Date()));
}
var snowBuilt = false;
function buildChristmas() {
  if (snowBuilt) return;
  snowBuilt = true;
  var snow = $("snow"), sparkles = $("sparkles");
  for (var i = 0; i < 22; i++) {
    var f = document.createElement("div");
    f.className = "flake" + (i % 2 ? " drift-left" : "");
    var size = (2 + Math.random() * 4).toFixed(1);
    f.style.left = Math.round(Math.random() * 1920) + "px";
    f.style.width = size + "px";
    f.style.height = size + "px";
    f.style.animationDuration = (15 + Math.random() * 11).toFixed(1) + "s";
    f.style.animationDelay = (-Math.random() * 26).toFixed(1) + "s";
    snow.appendChild(f);
  }
  for (var j = 0; j < 5; j++) {
    var p = document.createElement("div");
    p.className = "spark";
    p.style.left = Math.round(140 + Math.random() * 1640) + "px";
    p.style.top = Math.round(430 + Math.random() * 400) + "px";
    p.style.animationDuration = (6 + Math.random() * 6).toFixed(1) + "s";
    p.style.animationDelay = (-Math.random() * 12).toFixed(1) + "s";
    sparkles.appendChild(p);
  }
}
function updateChristmas() {
  var enabled = christmasEnabled();
  if (enabled) buildChristmas();
  $("xmas").classList.toggle("hide", !enabled);
}
function apply() {
  $("home").classList.toggle("hide", S.mode !== "home");
  $("shelf").classList.toggle("hide", S.mode !== "shelf");
  $("bg").classList.toggle("hide", S.bg === "off");
  if (S.bg !== "off") $("bg").style.backgroundImage = "url(bg" + S.bg + ".jpg)";
  $("glows").classList.toggle("hide", S.glow !== "on");
  updateChristmas();
  render();
}

function toast(t) { var e = $("toast"); e.textContent = t; e.classList.add("show"); setTimeout(function () { e.classList.remove("show"); }, 3000); }
function launchId(id, name, fail) {
  try {
    if (window.tizen && tizen.application) { tizen.application.launch(id, null, function () { toast(fail || ("Nem indítható: " + name)); }); return; }
  } catch (e) { toast(fail || ("Nem indítható: " + name)); return; }
  toast("Tizen API nem elérhető (böngészőben nem indul): " + name);
}

/* beállítások panel */
var ROWS = [
  { label:"Nézet",       key:"mode", opts:[["home","Home"],["shelf","Polc"]] },
  { label:"Város",       key:"city", opts:CITIES.map(function (c, n) { return [n, c.name]; }) },
  { label:"Háttérkép",   key:"bg",   opts:[["1","Éjszaka"],["2","Alkonyat"],["3","Aurora"],["4","Köd"],["5","Grafit"],["off","Egyszínű"]] },
  { label:"Színes fény", key:"glow", opts:[["on","Be"],["off","Ki"]] },
  { label:"Karácsonyi effekt", key:"xmas", opts:[["auto","Automatikus"],["on","Be"],["off","Ki"]] },
  { label:"TV beállítások", act:"tv" },
  { label:"Összes alkalmazás", act:"apps" },
  { label:"Bezárás",        act:"close" }
];

/* telepített appok: a valódi azonosítók a TV-ről jönnek (ha a Tizen API elérhető) */
var MATCH = [/netflix/i, /^youtube$|^youtube tv$/i, /prime video|amazon/i, /disney/i, /plex/i, /spotify/i];
function discover() {
  try {
    if (!(window.tizen && tizen.application && tizen.application.getAppsInfo)) return;
    tizen.application.getAppsInfo(function (list) {
      INSTALLED = list.slice().sort(function (a, b) { return String(a.name).toLowerCase() < String(b.name).toLowerCase() ? -1 : 1; });
      MATCH.forEach(function (re, n) {
        for (var k = 0; k < INSTALLED.length; k++) if (re.test(INSTALLED[k].name)) { ITEMS[n].id = INSTALLED[k].id; break; }
      });
      for (var k = 0; k < INSTALLED.length; k++) if (/^(settings|beállítások|setting)$/i.test(INSTALLED[k].name)) { TV_ID = INSTALLED[k].id; break; }
    }, function () {});
  } catch (e) {}
}
function optIndex(r) { for (var k = 0; k < r.opts.length; k++) if (r.opts[k][0] === S[r.key]) return k; return 0; }
function drawApps() {
  var h = "";
  if (!INSTALLED.length) h = '<div class="row sm"><span>A telepített appok listája nem érhető el (Tizen API hiányzik).</span></div>';
  for (var k = aoff; k < Math.min(aoff + 9, INSTALLED.length); k++)
    h += '<div class="row sm' + (k === arow ? " focus" : "") + '"><span>' + INSTALLED[k].name + '</span><span class="val">' + (k + 1) + " / " + INSTALLED.length + "</span></div>";
  $("rows").innerHTML = h;
  $("ptitle").textContent = "Összes alkalmazás";
}
function drawPanel() {
  if (pview === "apps") return drawApps();
  $("ptitle").textContent = "Beállítások";
  var h = "";
  ROWS.forEach(function (r, n) {
    var v = r.opts ? "&#8249; " + r.opts[optIndex(r)][1] + " &#8250;" : "";
    h += '<div class="row' + (n === prow ? " focus" : "") + '"><span>' + r.label + '</span><span class="val">' + v + "</span></div>";
  });
  $("rows").innerHTML = h;
}
function openPanel() { panel = true; pview = "main"; prow = 0; $("panel").classList.remove("hide"); drawPanel(); }
function closePanel() { panel = false; $("panel").classList.add("hide"); }
function change(dir) {
  var r = ROWS[prow]; if (!r.opts) return;
  var n = (optIndex(r) + dir + r.opts.length) % r.opts.length;
  S[r.key] = r.opts[n][0]; save(); apply(); drawPanel();
  if (r.key === "city") weather();
}
function appsKey(k) {
  var n = INSTALLED.length;
  if (k === 10009 || k === 27 || k === 8) { pview = "main"; return drawPanel(); }
  if (!n) return;
  if (k === 38) arow = Math.max(arow - 1, 0);
  else if (k === 40) arow = Math.min(arow + 1, n - 1);
  else if (k === 13) { closePanel(); return launchId(INSTALLED[arow].id, INSTALLED[arow].name); }
  if (arow < aoff) aoff = arow;
  if (arow >= aoff + 9) aoff = arow - 8;
  drawApps();
}
function panelKey(k) {
  if (pview === "apps") return appsKey(k);
  if (k === 10009 || k === 27 || k === 8) return closePanel();
  if (k === 38) prow = (prow + ROWS.length - 1) % ROWS.length;
  else if (k === 40) prow = (prow + 1) % ROWS.length;
  else if (k === 37) change(-1);
  else if (k === 39) change(1);
  else if (k === 13) {
    var r = ROWS[prow];
    if (r.act === "close") return closePanel();
    if (r.act === "apps") { pview = "apps"; aoff = arow = 0; return drawPanel(); }
    if (r.act === "tv") { closePanel(); return launchId(TV_ID, "TV beállítások", "A TV beállításai innen nem nyithatók. Keresd az Összes alkalmazás listában, vagy használd a távirányító Settings gombját."); }
    change(1);
  }
  drawPanel();
}

function press() {
  var el = S.mode === "home" ? tiles[idx] : cards[idx];
  el.classList.add("press"); setTimeout(function () { el.classList.remove("press"); }, 120);
}
document.addEventListener("keydown", function (e) {
  var k = e.keyCode, n = ITEMS.length;
  $("hint").classList.add("off");
  if (panel) return panelKey(k);
  if (k === 49 || k === 403) { S.mode = "home"; save(); return apply(); }
  if (k === 50 || k === 404) { S.mode = "shelf"; save(); return apply(); }
  if (k === 13) { press(); return ITEMS[idx].settings ? openPanel() : launchId(ITEMS[idx].id, ITEMS[idx].name); }
  if (k === 39) idx = Math.min(idx + 1, n - 1);
  else if (k === 37) idx = Math.max(idx - 1, 0);
  render();
});

function tick() {
  updateChristmas(); // Re-evaluate automatic season when the date changes.
  var d = new Date();
  var t = d.toLocaleTimeString("hu-HU", { hour:"2-digit", minute:"2-digit" });
  $("clock").textContent = t; $("mclock").textContent = t;
  $("date").textContent = d.toLocaleDateString("hu-HU", { weekday:"long", month:"long", day:"numeric" });
}

var WX = { 0:"derült", 1:"enyhén felhős", 2:"részben felhős", 3:"borult", 45:"köd", 48:"zúzmarás köd", 51:"szitálás", 53:"szitálás", 55:"szitálás",
           61:"eső", 63:"eső", 65:"zuhogó eső", 71:"hószállingó", 73:"havazás", 75:"erős havazás", 80:"zápor", 81:"zápor", 82:"heves zápor", 95:"zivatar", 96:"zivatar", 99:"zivatar" };
function setWx(t) { $("wx").textContent = t; $("mwx").textContent = t; }
function weather() {
  var c = CITIES[S.city];
  setWx(c.name);
  var x = new XMLHttpRequest();
  x.open("GET", "https://api.open-meteo.com/v1/forecast?latitude=" + c.lat + "&longitude=" + c.lon + "&current=temperature_2m,weather_code&timezone=Europe%2FBudapest");
  x.timeout = 10000;
  x.onload = function () {
    try {
      var cur = JSON.parse(x.responseText).current;
      setWx(c.name + " · " + Math.round(cur.temperature_2m) + " °C · " + (WX[cur.weather_code] || ""));
    } catch (e) {}
  };
  x.send();
}

load(); apply(); discover();
tick(); setInterval(tick, 20000);
weather(); setInterval(weather, 30 * 60 * 1000);
setTimeout(function () { $("hint").classList.add("off"); }, 8000);
</script>
