<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920">
<title>Launcher</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { width:1920px; height:1080px; overflow:hidden; background:#08080c; color:#fff;
    font-family:"SamsungOne","Segoe UI",-apple-system,Helvetica,Arial,sans-serif; -webkit-font-smoothing:antialiased; }
  .hide { display:none !important; }

  /* ambient háttér: az app színe lágyan átúszik (csak opacity) */
  #amb { position:absolute; left:0; top:0; width:1920px; height:1080px; background:#08080c; }
  #amb .g { position:absolute; left:0; top:0; width:1920px; height:1080px; opacity:0; transition:opacity 600ms ease; }
  #amb .g.on { opacity:1; }
  #amb .base { opacity:1; background:radial-gradient(1100px 700px at 12% 105%, rgba(70,60,160,.35), rgba(0,0,0,0) 70%); }

  /* közös */
  .sec { color:rgba(255,255,255,.6); }

  /* HOME */
  #clock { position:absolute; left:120px; top:150px; font-size:210px; line-height:210px; font-weight:200; letter-spacing:-6px; }
  #date { position:absolute; left:128px; top:120px; font-size:34px; font-weight:500; text-transform:capitalize; }
  #wx { position:absolute; left:128px; top:380px; font-size:34px; font-weight:400; }

  #dock { position:absolute; left:0; width:1920px; bottom:170px; text-align:center; font-size:0; }
  .tile { position:relative; display:inline-block; vertical-align:top; width:200px; height:200px; margin:0 18px; border-radius:46px;
    text-align:center; line-height:200px; font-size:76px; font-weight:600; letter-spacing:-2px; color:#fff;
    transform:translateZ(0) scale(1); transition:transform 180ms cubic-bezier(.23,1,.32,1); }
  .tile::before { content:""; position:absolute; left:0; top:0; width:200px; height:200px; border-radius:46px; z-index:-1;
    box-shadow:0 34px 60px rgba(0,0,0,.65); opacity:0; transition:opacity 180ms cubic-bezier(.23,1,.32,1); }
  .tile::after { content:""; position:absolute; left:0; top:0; right:0; bottom:0; border-radius:46px; opacity:.55;
    background:linear-gradient(160deg, rgba(255,255,255,.34), rgba(255,255,255,0) 48%); transition:opacity 180ms cubic-bezier(.23,1,.32,1); }
  .tile.focus { transform:translateZ(0) scale(1.14); }
  .tile.focus::before { opacity:1; }
  .tile.focus::after { opacity:1; }
  .tile.press { transform:translateZ(0) scale(1.07); transition-duration:90ms; }
  #label { position:absolute; left:0; width:1920px; bottom:92px; text-align:center; font-size:34px; font-weight:500; }

  /* SHELF */
  #hero { position:absolute; left:128px; top:210px; }
  #hero h1 { font-size:128px; line-height:128px; font-weight:700; letter-spacing:-4px; }
  #hero p { font-size:40px; margin-top:20px; font-weight:400; }
  #view { position:absolute; left:0; top:600px; width:1920px; height:330px; overflow:hidden; }
  #row { position:absolute; left:128px; top:50px; white-space:nowrap; font-size:0; transition:transform 300ms cubic-bezier(.23,1,.32,1); }
  .card { position:relative; display:inline-block; vertical-align:top; width:380px; height:214px; margin-right:44px; border-radius:30px;
    text-align:left; font-size:46px; font-weight:700; letter-spacing:-1px; color:#fff; padding:0 0 0 34px; line-height:214px;
    transform:translateZ(0) scale(1); transition:transform 180ms cubic-bezier(.23,1,.32,1); }
  .card::before { content:""; position:absolute; left:0; top:0; width:380px; height:214px; border-radius:30px; z-index:-1;
    box-shadow:0 34px 60px rgba(0,0,0,.65); opacity:0; transition:opacity 180ms cubic-bezier(.23,1,.32,1); }
  .card::after { content:""; position:absolute; left:0; top:0; right:0; bottom:0; border-radius:30px; opacity:.5;
    background:linear-gradient(160deg, rgba(255,255,255,.34), rgba(255,255,255,0) 50%); transition:opacity 180ms cubic-bezier(.23,1,.32,1); }
  .card.focus { transform:translateZ(0) scale(1.1); }
  .card.focus::before { opacity:1; }
  .card.focus::after { opacity:1; }
  .card.press { transform:translateZ(0) scale(1.05); transition-duration:90ms; }

  /* kis óra shelf módban */
  #mini { position:absolute; right:120px; top:104px; text-align:right; font-size:40px; font-weight:500; }

  #toast { position:absolute; left:0; width:1920px; bottom:30px; text-align:center; font-size:26px; opacity:0; transition:opacity 200ms ease; }
  #toast.show { opacity:1; }
  #hint { position:absolute; right:120px; bottom:40px; font-size:22px; opacity:.5; transition:opacity 600ms ease; }
  #hint.off { opacity:0; }
</style>
</head>
<body>

<div id="amb"><div class="g base"></div></div>

<div id="home">
  <div id="date" class="sec"></div>
  <div id="clock"></div>
  <div id="wx" class="sec"></div>
  <div id="dock"></div>
  <div id="label"></div>
</div>

<div id="shelf" class="hide">
  <div id="mini"><span id="mclock"></span><div id="mwx" class="sec" style="font-size:28px;font-weight:400;margin-top:6px"></div></div>
  <div id="hero"><h1 id="ctitle"></h1><p id="csub" class="sec"></p></div>
  <div id="view"><div id="row"></div></div>
</div>

<div id="toast"></div>
<div id="hint">1 Home · 2 Polc</div>

<script>
// ponytail: appId-k Samsung alapértelmezések, modellenként eltérhetnek; a TV-n ellenőrizd.
// ponytail: a glyph egyszerű monogram, saját logók később: tile.style.backgroundImage.
var APPS = [
  { name:"Netflix", id:"3201907018807", color:"#e50914", glyph:"N",  sub:"Sorozatok és filmek" },
  { name:"YouTube", id:"111299001912",  color:"#ff2d3d", glyph:"YT", sub:"Videók" },
  { name:"Prime",   id:"3201910019365", color:"#1a98ff", glyph:"P",  sub:"Prime Video" },
  { name:"Disney+", id:"3201901017640", color:"#1b4dff", glyph:"D+", sub:"Disney+" },
  { name:"Plex",    id:"3201512006963", color:"#e5a00d", glyph:"Pl", sub:"Saját médiatár" },
  { name:"Spotify", id:"3201606009684", color:"#1ed760", glyph:"S",  sub:"Zene" }
];
var LAT = 46.36, LON = 17.66;      // Kaposfő (kb.)
var mode = "home", idx = 0;

function $(id) { return document.getElementById(id); }
function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) {} }
function paint(el, c) { el.style.background = "linear-gradient(180deg," + c + ",rgba(0,0,0,.55)), " + c; }

var glows = [], tiles = [], cards = [];
APPS.forEach(function (a, n) {
  var g = document.createElement("div");
  g.className = "g";
  g.style.background = "radial-gradient(1000px 640px at 78% 8%," + a.color + "66,rgba(0,0,0,0) 70%)";
  $("amb").appendChild(g); glows.push(g);

  var t = document.createElement("div");
  t.className = "tile"; t.textContent = a.glyph; paint(t, a.color);
  $("dock").appendChild(t); tiles.push(t);

  var c = document.createElement("div");
  c.className = "card"; c.textContent = a.name; paint(c, a.color);
  $("row").appendChild(c); cards.push(c);
});

function render() {
  for (var k = 0; k < APPS.length; k++) {
    var on = k === idx;
    tiles[k].classList.toggle("focus", on && mode === "home");
    cards[k].classList.toggle("focus", on && mode === "shelf");
    glows[k].classList.toggle("on", on);
  }
  $("label").textContent = APPS[idx].name;
  $("ctitle").textContent = APPS[idx].name;
  $("csub").textContent = APPS[idx].sub;
  $("row").style.webkitTransform = $("row").style.transform = "translateX(" + (-Math.max(0, idx - 2) * 424) + "px)";
}
function setMode(m) {
  mode = m;
  $("home").classList.toggle("hide", m !== "home");
  $("shelf").classList.toggle("hide", m !== "shelf");
  store("mode", m); render();
}
function toast(t) { var e = $("toast"); e.textContent = t; e.classList.add("show"); setTimeout(function () { e.classList.remove("show"); }, 2500); }
function launch(a) {
  try {
    if (window.tizen && tizen.application) { tizen.application.launch(a.id, null, function () { toast("Nem indítható: " + a.name); }); return; }
  } catch (e) {}
  toast("Tizen API nem elérhető (böngészőben nem indul): " + a.name);
}
function press() {
  var el = mode === "home" ? tiles[idx] : cards[idx];
  el.classList.add("press"); setTimeout(function () { el.classList.remove("press"); }, 120);
}

document.addEventListener("keydown", function (e) {
  var k = e.keyCode, n = APPS.length;
  $("hint").classList.add("off");
  if (k === 49 || k === 403) return setMode("home");
  if (k === 50 || k === 404) return setMode("shelf");
  if (k === 13) { press(); return launch(APPS[idx]); }
  if (k === 39) idx = Math.min(idx + 1, n - 1);
  else if (k === 37) idx = Math.max(idx - 1, 0);
  render();
});

function tick() {
  var d = new Date();
  var t = d.toLocaleTimeString("hu-HU", { hour:"2-digit", minute:"2-digit" });
  $("clock").textContent = t; $("mclock").textContent = t;
  $("date").textContent = d.toLocaleDateString("hu-HU", { weekday:"long", month:"long", day:"numeric" });
}

var WX = { 0:"derült", 1:"enyhén felhős", 2:"részben felhős", 3:"borult", 45:"köd", 48:"zúzmarás köd", 51:"szitálás", 53:"szitálás", 55:"szitálás",
           61:"eső", 63:"eső", 65:"zuhogó eső", 71:"hószállingó", 73:"havazás", 75:"erős havazás", 80:"zápor", 81:"zápor", 82:"heves zápor", 95:"zivatar", 96:"zivatar", 99:"zivatar" };
function setWx(t) { $("wx").textContent = t; $("mwx").textContent = t; }
function weather() {
  var x = new XMLHttpRequest();
  x.open("GET", "https://api.open-meteo.com/v1/forecast?latitude=" + LAT + "&longitude=" + LON + "&current=temperature_2m,weather_code&timezone=Europe%2FBudapest");
  x.timeout = 10000;
  x.onload = function () {
    try {
      var c = JSON.parse(x.responseText).current;
      setWx("Kaposfő · " + Math.round(c.temperature_2m) + " °C · " + (WX[c.weather_code] || ""));
    } catch (e) { setWx("Kaposfő"); }
  };
  x.onerror = x.ontimeout = function () { setWx("Kaposfő"); };
  x.send();
}

tick(); setInterval(tick, 20000);
weather(); setInterval(weather, 30 * 60 * 1000);
setTimeout(function () { $("hint").classList.add("off"); }, 8000);
setMode(store("mode") === "shelf" ? "shelf" : "home");
</script>
</body>
</html>
